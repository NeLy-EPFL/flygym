name: Tests

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-core:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install EGL/Mesa dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1-mesa-dev libgles2-mesa-dev libosmesa6-dev

      - name: Install Python dependencies
        run: uv sync --extra dev --extra examples

      - name: Run tests
        env:
          # mujoco hardcodes CGL on macOS and GLFW on Windows; neither can create
          # a headless OpenGL context on GitHub-hosted runners (no GPU), so skip
          # rendering tests there. Linux uses EGL/Mesa and runs them.
          SKIP_RENDERING_TESTS: ${{ runner.os == 'Linux' && '0' || '1' }}
        # Collect the whole tree but use marker selection (not directory
        # selection) to drop the groups CI can't run: warp needs a CUDA GPU, and
        # the tutorial notebooks are too slow for CI. Rendering tests are gated
        # separately via SKIP_RENDERING_TESTS above.
        run: uv run pytest tests/ -m "not warp" -v --tb=short
