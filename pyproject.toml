[project]
name = "flygym"
version = "2.1.0"
description = "NeuroMechFly, a framework for simulating embodied sensorimotor control in adult Drosophila."
requires-python = ">=3.12,<3.15"
authors = [
    { name = "Sibo Wang-Chen", email = "sibo.wang@epfl.ch" },
    { name = "Victor Alfred Stimpfling", email = "victor.stimpfling@epfl.ch" },
    { name = "Thomas Ka Chung Lam", email = "thomas.lam@epfl.ch" },
    { name = "Pembe Gizem Özdil", email = "pembe.ozdil@epfl.ch" },
    { name = "Louise Genoud", email = "louise.genoud@epfl.ch" },
    { name = "Femke Hurtak", email = "femke.hurtak@epfl.ch" },
    { name = "Pavan Ramdya", email = "pavan.ramdya@epfl.ch" },
]
maintainers = [
    { name = "Sibo Wang-Chen", email = "sibo.wang@epfl.ch" },
    { name = "Victor Alfred Stimpfling", email = "victor.stimpfling@epfl.ch" },
    { name = "Dominic Dall'Osto", email = "dominic.dallosto@epfl.ch" },
    { name = "Thomas Ka Chung Lam", email = "thomas.lam@epfl.ch" },
]
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "mujoco>=3.9,<3.10",
    "numpy>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "mediapy>=1.2,<3.0",
    "imageio>=2.37,<3.0",
    "imageio-ffmpeg==0.6.0",
    "jaxtyping==0.3.7",
    "tabulate==0.9.0",
    "loguru==0.7.3",
    "pillow>=11,<13",
    "matplotlib>=3.10,<4.0",
    "numba>=0.65.1",
    "scipy>=1.15,<2.0",
]

[project.optional-dependencies]
warp = [
    "warp-lang>=1.14,<1.15",
    "mujoco_warp>=3.9,<3.10",
]
dev = [
    # Testing
    "pytest>=9.0,<10.0",
    "pytest-cov>=7.0,<8.0",
    # Formatting and linting
    "ruff==0.15.13",
    # PyPI publishing
    "build>=1.0,<2.0",
    "twine>=6.0,<7.0",
    # Documentation site — built with ProperDocs, a drop-in continuation of
    # MkDocs 1.x (the upstream MkDocs project is moving to a backwards-
    # incompatible 2.0). ProperDocs reads properdocs.yml and loads the
    # mkdocs.* theme/plugin entry points below unchanged.
    "properdocs>=1.6.7,<2",
    "mkdocs-material>=9.7,<10.0",
    "mkdocstrings[python]>=1.0.0,<2",
    "mkdocs-gen-files==0.6.0",
    "mkdocs-literate-nav==0.6.3",
    "mkdocs-section-index==0.3.12",
    "mkdocs-jupyter==0.26.1",
    # Mesh simplification
    "trimesh>=4.0,<5.0",
    "shapely>=2.0,<3.0",
    "mapbox-earcut>=2.0,<3.0",
    "fast-simplification==0.1.13",
    "networkx>=3.0,<4.0",
    "rtree>=1.0,<2.0",
    # Git pre-commit filter: strips output from ipynb notebooks
    "nbstripout==0.9.1",
    "rasterio>=1.5.0",
    # Profiling (see scripts/replay_behavior_{cpu,gpu}.py --profile)
    "py-spy>=0.4,<0.5",  # CPU sampling profiler -> speedscope
    "nvtx>=0.2,<0.3",  # NVTX ranges for the GPU script's Nsight timeline
]
examples = [
    "ipykernel>=7.1.0",
    "ipython>=9.10,<10.0",
    "pandas>=3.0,<4.0",
    "tqdm>=4.67,<5.0",
]
rl = [
    "gymnasium>=1.0,<2.0",
    "stable_baselines3>=2.7,<3.0",
    "tensorboard>=2.20,<3.0",
    # tensorboard still imports pkg_resources, which setuptools removed in 81.
    "setuptools<81",
]

[project.urls]
homepage = "https://neuromechfly.org/"
repository = "https://github.com/NeLy-EPFL/flygym"
documentation = "https://neuromechfly.org/"
"Bug Tracker" = "https://github.com/NeLy-EPFL/flygym/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=flygym --cov=flygym_demo --cov-report=term-missing --import-mode=importlib"
# Test selection is driven by markers, not by which directory a test lives in,
# so a test can declare an optional-dependency requirement wherever it lives and
# be excluded with e.g. `pytest -m "not warp"`.
markers = [
    "warp: requires the warp (GPU) extra (skip with -m 'not warp')",
    "rl: requires the rl extra (gymnasium + Stable-Baselines3 + TensorBoard) (skip with -m 'not rl')",
    "tutorial: executes a tutorial notebook end-to-end; slow (skip with -m 'not tutorial')",
    "network: talks to the live S3 asset bucket (skips itself if unreachable)",
]
filterwarnings = [
    # warp 1.14.0 defines ctypes.Structure subclasses with `_pack_` but no
    # `_layout_`; Python 3.14 deprecates the implicit default. Third-party code,
    # don't fix here.
    "ignore:Due to '_pack_':DeprecationWarning:warp",
]

[tool.coverage.run]
source = ["flygym", "flygym_demo"]

[tool.setuptools]
package-dir = {"" = "src"}
# Disabled on purpose: with no MANIFEST.in and no setuptools-scm, the auto-include
# finds no data files. Instead, use the explicit ``package-data`` globs below.
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# List every bundled asset explicitly to reliably get them into the wheel/sdist.
# Larger data files excluded below are instead fetched lazily from an S3 bucket at
# runtime (see ``flygym.utils.assets_lazy_loading``).
flygym = [
    "assets/**",
]
flygym_demo = [
    "spotlight_data/assets/**",
    "complex_terrain/assets/**",
    "muscle_imitation/assets/**",
    "ball_flybody_data/assets/**",
]

[tool.setuptools.exclude-package-data]
flygym = [
    "assets/model/neuromechfly/meshes/fullsize/*",
    "assets/model/flybody/meshes/**/*",
    "assets/model/musculoskeletal/meshes/**/*",
]

[tool.ruff.lint]
# Disable the following ruff linting rules globally:
ignore = [
    "F722",  # some jaxtyping warp type hints break this rule on purpose
]

[tool.ruff.lint.per-file-ignores]
# Allow the following ruff linting rules in test files:
"tests/**/*.py" = [
    "F401",  # unused imports
    "F841",  # unused variables
    "F811",  # duplicated imports
    "E402",  # module level import not at top of file
]
